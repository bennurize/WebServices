syntax = "proto3";

package user;

service UserService {
  rpc Register (RegisterRequest) returns (User);
  rpc Login (LoginRequest) returns (LoginResponse);
  // Batch lookup, used by the gateway to display recipe authors
  rpc GetUsers (GetUsersRequest) returns (GetUsersResponse);
}

message User {
  string id = 1;
  string email = 2;
  string name = 3;
}

message RegisterRequest {
  string email = 1;
  string name = 2;
  string password = 3;
}

message LoginRequest {
  string email = 1;
  string password = 2;
}

message LoginResponse {
  // JWT signed by the user service, verified by the gateway
  string token = 1;
  User user = 2;
}

message GetUsersRequest {
  repeated string ids = 1;
}

message GetUsersResponse {
  repeated User users = 1;
}
