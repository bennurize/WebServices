syntax = "proto3";

package recipe;

// The caller's identity travels in the `x-user-id` metadata, set by the gateway
service RecipeService {
  rpc ListRecipes (ListRecipesRequest) returns (ListRecipesResponse);
  rpc GetRecipe (RecipeIdRequest) returns (Recipe);
  rpc CreateRecipe (CreateRecipeRequest) returns (Recipe);
  rpc DeleteRecipe (RecipeIdRequest) returns (Empty);
}

message Recipe {
  string id = 1;
  string owner_id = 2;
  string title = 3;
  repeated string ingredients = 4;
  repeated string steps = 5;
  // Written asynchronously by the enricher
  string description = 6;
  // pending | done | failed
  string status = 7;
  string created_at = 8;
}

message ListRecipesRequest {
  int32 limit = 1;
}

message ListRecipesResponse {
  repeated Recipe recipes = 1;
}

message RecipeIdRequest {
  string id = 1;
}

message CreateRecipeRequest {
  string title = 1;
  repeated string ingredients = 2;
  repeated string steps = 3;
}

message Empty {}
